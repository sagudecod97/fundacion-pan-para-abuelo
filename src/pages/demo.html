<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <script type="module">
      import "@/scripts/pages/demo.js";
    </script>
    <title>Fundación Pan para un Abuelo: Base Components</title>
    <style>
      body {
        height: 110vh;
        background-color: var(--color-bg);
      }
      h1 {
        font-size: 4.5rem;
      }

      h2 {
        font-size: 2.4rem;
      }

      h3 {
        font-size: 1.6rem;
      }

      h1,
      h2,
      h3 {
        text-align: left;
        padding: 2rem 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Demo Page</h1>

    <h2>Buttons Variants</h2>
    <h3>Buttons Default</h3>
    <div
      style="
        padding: 0 3rem;
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
      "
    >
      <button class="btn">Button 1</button>
      <button class="btn">Button 2</button>
    </div>

    <h3>Colors Variants</h3>

    <div
      style="
        padding: 0 3rem;
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
      "
    >
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-success">Success</button>
      <button class="btn btn-warning">Warning</button>
      <button class="btn btn-danger">Danger</button>
      <button class="btn btn-info">Info</button>
      <button class="btn btn-dark">Dark</button>
      <button class="btn btn-light">Light</button>
    </div>

    <h3>Buttons Square and Pill</h3>
    <div
      style="
        padding: 0 3rem;
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
      "
    >
      <button class="btn btn-light --square">Square</button>
      <button class="btn btn-dark --pill">Pill</button>
    </div>

    <h3>Size Variants</h3>
    <div
      style="
        padding: 0 3rem;
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
      "
    >
      <button class="btn btn-light btn-sm">Small</button>
      <button class="btn btn-dark btn-lg">Large</button>
    </div>

    <h3>Ghost Variants</h3>

    <div
      style="
        padding: 0 3rem;
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
      "
    >
      <button class="btn btn-ghost__primary">Primary</button>
      <button class="btn btn-ghost__secondary">Secondary</button>
      <button class="btn btn-ghost__success">Success</button>
      <button class="btn btn-ghost__warning">Warning</button>
      <button class="btn btn-ghost__danger">Danger</button>
      <button class="btn btn-ghost__info">Info</button>
      <button class="btn btn-ghost__light">Light</button>
    </div>
  </body>
</html>
