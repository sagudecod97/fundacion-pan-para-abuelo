<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <script src="./src/scripts/pages/index.js" type="module"></script>
    <title>Fundación Pan para un Abuelo: Base Components</title>
    <style>
      h1,
      h2 {
        text-align: left;
        padding: 2rem 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Demo Page</h1>

    <h2>Buttons Default</h2>
    <div
      style="
        padding: 0 3rem;
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
      "
    >
      <button class="btn">No Class</button>
      <button class="btn">Class</button>
    </div>

    <h2>Colors Variants</h2>

    <div
      style="
        padding: 0 3rem;
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
      "
    >
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-success">Success</button>
      <button class="btn btn-warning">Warning</button>
      <button class="btn btn-danger">Danger</button>
      <button class="btn btn-info">Info</button>
      <button class="btn btn-dark">Dark</button>
      <button class="btn btn-light">Light</button>
    </div>

    <h2>Buttons Square and Pill</h2>
    <div
      style="
        padding: 0 3rem;
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
      "
    >
      <button class="btn btn-light --square">No Class</button>
      <button class="btn btn-dark --pill">Class</button>
    </div>
  </body>
</html>
